<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="متجر بونتي راش — حسابات، جواهر وخدمات للاعبي One Piece Bounty Rush">
<title>بونتي راش | المتجر الأسطوري</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#030303;
  --panel:#0a0b0d;
  --panel2:#101216;
  --gold:#ffb300;
  --orange:#ff5a00;
  --yellow:#ffe082;
  --white:#fff;
  --muted:#8f9298;
  --line:rgba(255,255,255,.09);
  --green:#47e38b;
  --red:#ff4d67;
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,153,0,.10),transparent 30%),
    radial-gradient(circle at 10% 60%,rgba(255,80,0,.06),transparent 25%),
    var(--bg);
  color:white;
  font-family:"Cairo",sans-serif;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:55px 55px;
  mask-image:linear-gradient(to bottom,black,transparent);
  z-index:-2;
}

::selection{
  background:var(--gold);
  color:#000;
}

button,input,select,textarea{font-family:inherit}

button{cursor:pointer}

a{text-decoration:none;color:inherit}

/* LOADING */

.loader{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#020202;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
  transition:.8s;
}

.loader-logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:-2px;
}

.loader-logo span{color:var(--gold)}

.loader-sword{
  width:180px;
  height:2px;
  background:#222;
  position:relative;
  overflow:hidden;
}

.loader-sword:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:loading 1.3s infinite;
}

@keyframes loading{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}

/* FLOATING PARTICLES */

.particle{
  position:fixed;
  width:3px;
  height:3px;
  border-radius:50%;
  background:var(--gold);
  opacity:.5;
  pointer-events:none;
  z-index:-1;
  box-shadow:0 0 10px var(--gold);
  animation:particleFloat linear infinite;
}

@keyframes particleFloat{
  from{transform:translateY(110vh) translateX(0)}
  to{transform:translateY(-20vh) translateX(80px)}
}

/* NAV */

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:78px;
  z-index:1000;
  background:rgba(3,3,3,.75);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.nav-inner{
  max-width:1450px;
  height:100%;
  margin:auto;
  padding:0 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.logo span{
  color:var(--gold);
}

.nav-links{
  display:flex;
  gap:30px;
  color:#aaa;
  font-size:13px;
  font-weight:700;
}

.nav-links a{
  transition:.3s;
}

.nav-links a:hover{
  color:var(--gold);
}

.nav-actions{
  display:flex;
  gap:8px;
}

.nav-btn{
  width:43px;
  height:43px;
  border-radius:13px;
  color:white;
  background:#111;
  border:1px solid var(--line);
  position:relative;
}

.nav-btn:hover{
  border-color:var(--gold);
  color:var(--gold);
}

.counter{
  position:absolute;
  top:-5px;
  left:-5px;
  min-width:18px;
  height:18px;
  border-radius:50px;
  background:var(--gold);
  color:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:9px;
  font-weight:900;
}

.menu{
  display:none;
}

/* HERO */

.hero{
  min-height:100vh;
  position:relative;
  padding:140px 20px 80px;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.hero-inner{
  width:100%;
  max-width:1450px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:40px;
}

.hero-copy{
  position:relative;
  z-index:5;
}

.tag{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--gold);
  background:rgba(255,179,0,.08);
  border:1px solid rgba(255,179,0,.2);
  border-radius:50px;
  padding:8px 15px;
  font-size:11px;
  font-weight:800;
  margin-bottom:20px;
}

.tag i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.hero h1{
  font-size:clamp(42px,6vw,82px);
  line-height:1.02;
  letter-spacing:-3px;
  font-weight:900;
}

.hero h1 span{
  background:linear-gradient(90deg,var(--gold),var(--orange));
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#92959a;
  max-width:620px;
  line-height:2;
  margin:22px 0 28px;
  font-size:15px;
}

.hero-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  padding:14px 23px;
  border-radius:13px;
  font-weight:900;
  font-size:12px;
  transition:.3s;
}

.primary{
  background:linear-gradient(135deg,var(--gold),var(--orange));
  color:#000;
  box-shadow:0 12px 35px rgba(255,140,0,.2);
}

.primary:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 18px 50px rgba(255,140,0,.32);
}

.secondary{
  color:white;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
}

.secondary:hover{
  background:#171717;
}

/* LEVI VISUAL */

.hero-visual{
  height:570px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.energy{
  position:absolute;
  width:450px;
  height:450px;
  border-radius:50%;
  background:
    radial-gradient(circle,rgba(255,179,0,.20),rgba(255,91,0,.07) 40%,transparent 68%);
  filter:blur(5px);
  animation:energy 4s ease-in-out infinite;
}

@keyframes energy{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.13)}
}

.ring{
  position:absolute;
  width:440px;
  height:440px;
  border:1px solid rgba(255,179,0,.25);
  border-radius:50%;
  animation:rotate 15s linear infinite;
}

.ring:before,
.ring:after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 20px var(--gold);
}

.ring:before{top:25px;right:90px}
.ring:after{bottom:40px;left:70px}

@keyframes rotate{
  to{transform:rotate(360deg)}
}

/* LEVI PLACEHOLDER ART */

.levi{
  width:350px;
  height:490px;
  position:relative;
  z-index:5;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.levi-aura{
  position:absolute;
  width:290px;
  height:400px;
  border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,179,0,.03));
  filter:blur(3px);
}

.levi-character{
  width:230px;
  height:400px;
  position:relative;
  animation:levifloat 4s ease-in-out infinite;
  filter:drop-shadow(0 25px 35px rgba(0,0,0,.8));
}

@keyframes levifloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
}

/*
  Stylized original sword-warrior silhouette.
  It is intentionally not a direct copyrighted character reproduction.
*/

.head{
  position:absolute;
  top:35px;
  left:73px;
  width:84px;
  height:90px;
  border-radius:45% 45% 48% 48%;
  background:linear-gradient(145deg,#e9c5a5,#b68162);
}

.hair{
  position:absolute;
  top:22px;
  left:65px;
  width:100px;
  height:55px;
  background:#111;
  border-radius:60% 60% 30% 30%;
  transform:rotate(-5deg);
}

.eye{
  position:absolute;
  top:72px;
  width:12px;
  height:3px;
  background:#111;
  border-radius:10px;
}

.eye.one{left:88px}
.eye.two{left:128px}

.body{
  position:absolute;
  top:115px;
  left:47px;
  width:140px;
  height:225px;
  background:linear-gradient(145deg,#e5e2d9,#777);
  clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
}

.jacket{
  position:absolute;
  top:145px;
  left:35px;
  width:160px;
  height:190px;
  border-left:25px solid #222;
  border-right:25px solid #222;
  transform:skew(-4deg);
}

.arm{
  position:absolute;
  width:38px;
  height:170px;
  background:#d1a584;
  border-radius:30px;
  top:150px;
}

.arm.left{
  left:15px;
  transform:rotate(25deg);
}

.arm.right{
  right:8px;
  transform:rotate(-35deg);
}

.sword{
  position:absolute;
  width:8px;
  height:290px;
  background:linear-gradient(90deg,#aaa,#fff,#aaa);
  right:-12px;
  top:80px;
  transform:rotate(27deg);
  border-radius:8px;
  box-shadow:0 0 18px rgba(255,255,255,.3);
}

.sword-handle{
  position:absolute;
  width:28px;
  height:10px;
  background:#222;
  right:-27px;
  top:330px;
  transform:rotate(27deg);
}

.levi-label{
  position:absolute;
  bottom:10px;
  right:-45px;
  background:rgba(5,5,5,.8);
  border:1px solid var(--line);
  padding:10px 15px;
  border-radius:12px;
  backdrop-filter:blur(10px);
  font-size:11px;
  color:#aaa;
}

.levi-label strong{
  display:block;
  color:var(--gold);
  font-size:13px;
}

/* FLOATING CARDS */

.float-card{
  position:absolute;
  z-index:10;
  padding:12px 15px;
  border:1px solid var(--line);
  background:rgba(10,10,10,.75);
  backdrop-filter:blur(14px);
  border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  font-size:10px;
}

.float-card strong{
  display:block;
  color:white;
  font-size:12px;
}

.float-card small{
  color:#777;
}

.fc1{
  top:80px;
  right:10px;
  animation:floatCard 4s ease-in-out infinite;
}

.fc2{
  bottom:80px;
  left:0;
  animation:floatCard 5s ease-in-out infinite reverse;
}

@keyframes floatCard{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}

/* SECTIONS */

section{
  padding:100px 20px;
}

.container{
  max-width:1450px;
  margin:auto;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:35px;
}

.kicker{
  color:var(--gold);
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:7px;
}

.title{
  font-size:clamp(30px,4vw,52px);
  line-height:1;
  font-weight:900;
  letter-spacing:-2px;
}

.subtitle{
  color:#73767a;
  max-width:500px;
  font-size:12px;
  line-height:1.8;
}

/* PRODUCTS */

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.search{
  position:relative;
  flex:1;
  min-width:230px;
}

.search input{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  background:#0d0e10;
  color:white;
  outline:none;
  border-radius:12px;
  padding:0 45px 0 15px;
  font-size:12px;
}

.search span{
  position:absolute;
  right:16px;
  top:13px;
  color:#777;
}

select{
  height:48px;
  background:#0d0e10;
  border:1px solid var(--line);
  border-radius:12px;
  color:#aaa;
  padding:0 15px;
  outline:none;
  font-size:11px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
}

.product{
  background:linear-gradient(145deg,#111214,#08090a);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  transition:.35s;
  position:relative;
}

.product:hover{
  border-color:rgba(255,179,0,.4);
  box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.product-image{
  height:225px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at center,rgba(255,179,0,.17),transparent 35%),
    linear-gradient(145deg,#191a1d,#080808);
  overflow:hidden;
}

.product-image:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  border:1px solid rgba(255,179,0,.15);
  animation:productSpin 12s linear infinite;
}

@keyframes productSpin{
  to{transform:rotate(360deg)}
}

.product-icon{
  font-size:70px;
  position:relative;
  z-index:2;
  animation:iconFloat 3.5s ease-in-out infinite;
}

@keyframes iconFloat{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-8px) rotate(-2deg)}
}

.badge{
  position:absolute;
  z-index:5;
  top:12px;
  right:12px;
  background:var(--gold);
  color:#000;
  font-size:8px;
  font-weight:900;
  padding:5px 8px;
  border-radius:7px;
}

.heart{
  position:absolute;
  z-index:5;
  top:10px;
  left:10px;
  width:35px;
  height:35px;
  border-radius:10px;
  border:1px solid var(--line);
  color:white;
  background:rgba(0,0,0,.45);
}

.heart.active{
  color:#ff4d67;
}

.product-body{
  padding:17px;
}

.product-name{
  font-weight:900;
  font-size:14px;
}

.product-chars{
  color:#777;
  font-size:10px;
  margin-top:5px;
}

.stars{
  color:var(--gold);
  font-size:11px;
  margin:9px 0;
}

.product-info{
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.price{
  font-size:23px;
  font-weight:900;
  color:white;
}

.gems{
  color:var(--gold);
  font-size:10px;
}

.product-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:15px;
}

.product-buttons button{
  height:39px;
  border-radius:10px;
  font-size:10px;
  font-weight:900;
}

/* CATEGORY */

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
}

.category{
  min-height:190px;
  border:1px solid var(--line);
  border-radius:20px;
  padding:25px;
  background:linear-gradient(145deg,#101114,#080909);
  position:relative;
  overflow:hidden;
  transition:.35s;
}

.category:hover{
  transform:translateY(-7px);
  border-color:rgba(255,179,0,.35);
}

.category-icon{
  font-size:38px;
}

.category h3{
  margin-top:30px;
  font-size:17px;
}

.category p{
  color:#6f7175;
  font-size:10px;
  margin-top:5px;
}

.category-num{
  position:absolute;
  left:15px;
  bottom:-10px;
  color:rgba(255,255,255,.025);
  font-size:80px;
  font-weight:900;
}

/* STATS */

.stats-section{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(255,179,0,.035),transparent,rgba(255,91,0,.035));
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.stat{
  text-align:center;
  padding:30px;
  border-left:1px solid var(--line);
}

.stat:last-child{
  border-left:0;
}

.stat-number{
  color:var(--gold);
  font-size:48px;
  font-weight:900;
}

.stat-label{
  color:#707277;
  font-size:10px;
}

/* WHY */

.why{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.why-main{
  min-height:400px;
  padding:40px;
  border:1px solid var(--line);
  border-radius:25px;
  background:
    radial-gradient(circle at 70% 20%,rgba(255,179,0,.1),transparent 30%),
    #0b0c0e;
}

.why-main h2{
  font-size:42px;
  line-height:1.15;
  max-width:550px;
}

.why-main p{
  color:#777;
  max-width:550px;
  line-height:2;
  font-size:12px;
  margin:20px 0;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.feature{
  padding:27px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.03);
}

.feature-icon{
  font-size:25px;
}

.feature h3{
  margin-top:18px;
  font-size:13px;
}

.feature p{
  color:#6c6e72;
  font-size:10px;
  line-height:1.7;
  margin-top:7px;
}

/* TESTIMONIALS */

.testimonial{
  min-height:260px;
  padding:35px;
  border:1px solid var(--line);
  border-radius:25px;
  background:linear-gradient(145deg,#111214,#080808);
}

.test-stars{
  color:var(--gold);
  letter-spacing:3px;
}

.test-text{
  font-size:19px;
  line-height:1.8;
  max-width:800px;
  margin:22px 0;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--orange));
  color:#000;
  display:grid;
  place-items:center;
  font-weight:900;
}

.user small{
  display:block;
  color:#666;
  font-size:9px;
}

/* FAQ */

.faq{
  max-width:900px;
  margin:auto;
}

.faq-item{
  border-bottom:1px solid var(--line);
}

.faq-question{
  width:100%;
  background:none;
  border:0;
  color:white;
  padding:22px 5px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
  text-align:right;
  font-size:13px;
}

.faq-answer{
  color:#777;
  font-size:11px;
  line-height:1.9;
}

/* CONTACT */

.contact{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:18px;
}

.contact-info,.contact-form{
  border:1px solid var(--line);
  border-radius:25px;
  padding:35px;
  background:#0b0c0e;
}

.contact-info h2{
  font-size:38px;
  line-height:1.2;
}

.contact-info p{
  color:#777;
  font-size:12px;
  line-height:1.9;
  margin:15px 0 25px;
}

.contact-item{
  display:flex;
  gap:12px;
  color:#aaa;
  font-size:11px;
  margin:17px 0;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  color:#777;
  font-size:9px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,.field textarea{
  width:100%;
  color:white;
  background:#070809;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  outline:none;
}

.field textarea{
  min-height:130px;
  resize:vertical;
}

.field input:focus,.field textarea:focus{
  border-color:rgba(255,179,0,.5);
}

/* NEWSLETTER */

.newsletter{
  padding:70px 25px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:27px;
  background:
    radial-gradient(circle at 50% 0,rgba(255,179,0,.12),transparent 42%),
    #0a0b0d;
}

.newsletter h2{
  font-size:40px;
}

.newsletter p{
  color:#777;
  font-size:11px;
  margin:8px 0 22px;
}

.news-form{
  max-width:500px;
  margin:auto;
  display:flex;
  gap:8px;
}

.news-form input{
