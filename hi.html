<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPBR VIP STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@800;900&family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: #040508;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.15), transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(147, 51, 234, 0.12), transparent 50%);
            background-attachment: fixed;
        }

        /* Glass Panel */
        .glass-header {
            background: rgba(10, 12, 18, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid opacity;
            border-image: linear-gradient(90deg, transparent, #f59e0b, transparent) 1;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ffb703, #fb8500);
            clip-path: polygon(20% 0%, 100% 0, 100% 80%, 80% 100%, 0 100%, 0% 20%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: #000;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(251, 133, 0, 0.6);
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===================================
           🔥 الأزرار الجبارة (CYBER ULTRA BUTTONS)
           =================================== */

        /* زر الشراء الرئيسي - توهج نيون مع شفرة مائلة */
        .btn-cyber-buy {
            position: relative;
            background: linear-gradient(135deg, #ff9e00 0%, #e85d04 100%);
            color: #000 !important;
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            font-size: 0.85rem;
            padding: 10px 16px;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(232, 93, 4, 0.6);
            transition: all 0.15s ease-in-out;
            text-transform: uppercase;
        }

        .btn-cyber-buy:active {
            transform: scale(0.95);
            box-shadow: 0 0 35px rgba(255, 158, 0, 0.9);
            filter: brightness(1.2);
        }

        /* زر التفاصيل الهولوجرام الشفاف */
        .btn-cyber-info {
            position: relative;
            background: rgba(18, 24, 38, 0.8);
            color: #38bdf8;
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 9px 14px;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            border: 1px solid rgba(56, 189, 248, 0.4);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.15);
            transition: all 0.15s ease-in-out;
        }

        .btn-cyber-info:active {
            transform: scale(0.95);
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        /* =================================== */

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 12px;
            flex: 1;
            width: 100%;
        }

        .section-banner {
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.1), rgba(0,0,0,0));
            border-right: 4px solid #f59e0b;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        /* Card VIP Style */
        .cyber-card {
            background: #090d14;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: transform 0.2s;
        }

        .card-tag-head {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            gap: 6px;
        }

        .badge-ex {
            background: #dc2626;
            color: #fff;
            font-weight: 900;
            font-size: 0.65rem;
            padding: 3px 8px;
            clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.6);
        }

        .card-img-holder {
            height: 150px;
            background: #0d131f;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-content {
            padding: 14px;
        }

        .account-code {
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
        }

        .account-title {
            font-size: 0.95rem;
            font-weight: 900;
            color: #f8fafc;
            margin: 8px 0;
            line-height: 1.4;
        }

        .tags-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .cyber-tag {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .card-action-bar {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .price-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #ff9e00;
            text-shadow: 0 0 10px rgba(255, 158, 0, 0.3);
        }
    </style>
</head>
<body>

    <header class="glass-header">
        <div class="header-container">
            <div class="logo-box">
                <div class="logo-icon">OP</div>
                <span class="logo-title">OPBR VIP</span>
            </div>

            <a href="https://t.me/" target="_blank" class="btn-cyber-buy" style="padding: 7px 12px; font-size: 0.75rem;">
                💬 الدعم الفني
            </a>
        </div>
    </header>

    <main>
        <div class="section-banner">
            <h2 style="font-size: 1.1rem; font-weight: 900;">🔥 أقوى الحسابات المتاحة حالياً</h2>
            <p style="font-size: 0.7rem; color: #94a3b8;">تسليم فوري وآمن 100% مع الضمان الملكي</p>
        </div>

        <div class="cards-grid">
            
            <div class="cyber-card">
                <div class="card-tag-head">
                    <span class="badge-ex">4x EX ULTRA</span>
                </div>

                <div class="card-img-holder">
                    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
                        <rect width="100%" height="100%" fill="#0a0f18"/>
                        <circle cx="300" cy="200" r="90" fill="#e85d04" opacity="0.2"/>
                        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#ff9e00">LUFFY G5 EX</text>
                    </svg>
                </div>

                <div class="card-content">
                    <div class="account-code">
                        <span>CODE: <strong style="color: #fff;">#OP-9082</strong></span>
                        <span style="color: #22c55e;">✔ متوفر الآن</span>
                    </div>

                    <h3 class="account-title">حساب لوفي نيكا G5 + زورو الـ EX + كيد ولاو + روجر</h3>

                    <div class="tags-container">
                        <span class="cyber-tag">HB 34</span>
                        <span class="cyber-tag">دعم 162%</span>
                        <span class="cyber-tag">750+ Diamon</span>
                    </div>

                    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;">
                        <span style="font-size: 0.65rem; color: #64748b; font-weight:800;">السعر المطلوب:</span>
                        <div class="price-tag">$85</div>
                    </div>

                    <div class="card-action-bar">
                        <button onclick="alert('كود الحساب: OP-9082')" class="btn-cyber-info">
                            🔍 التفاصيل
                        </button>
                        <a href="https://t.me/" target="_blank" class="btn-cyber-buy">
                            ⚡ شراء الآن
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
