<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEVI MOD</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}


/* =========================================================
   VIDEO BACKGROUND
========================================================= */

#bgVideo{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-20;
    pointer-events:none;
}


/* =========================================================
   BLACK VIDEO OVERLAY
   أسود أكثر شوية لكن الفيديو يظل واضح
========================================================= */

.video-dark{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.30),
            rgba(0,0,0,.38)
        );

    z-index:-19;
}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

.ambient{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.055),
            transparent 50%
        );

    z-index:-18;

    pointer-events:none;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:18px;
}


/* =========================================================
   GLASS PANEL
========================================================= */

.login-panel{
    position:relative;

    width:min(410px,100%);

    padding:
        34px
        34px
        28px;

    border-radius:27px;

    background:
        linear-gradient(
            145deg,
            rgba(0,0,0,.19),
            rgba(0,0,0,.09)
        );

    border:
        1px solid rgba(255,255,255,.22);

    backdrop-filter:
        blur(7px)
        saturate(115%);

    -webkit-backdrop-filter:
        blur(7px)
        saturate(115%);

    box-shadow:
        0 25px 80px rgba(0,0,0,.52),
        inset 0 1px 0 rgba(255,255,255,.11),
        inset 0 0 35px rgba(0,0,0,.12);

    overflow:hidden;

    opacity:0;

    transform:
        translateY(45px)
        scale(.94);

    filter:blur(8px);

    animation:
        panelEnter
        1.1s
        .1s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


/* glass reflection */

.login-panel::before{
    content:"";

    position:absolute;

    top:-110px;
    left:-25%;

    width:150%;
    height:180px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.065),
            transparent
        );

    transform:rotate(-4deg);

    pointer-events:none;
}


/* subtle border */

.login-panel::after{
    content:"";

    position:absolute;

    inset:-1px;

    border-radius:28px;

    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.34),
            transparent 24%,
            transparent 72%,
            rgba(255,255,255,.16)
        );

    opacity:.55;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite:exclude;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
}


@keyframes panelEnter{

    0%{
        opacity:0;

        transform:
            translateY(45px)
            scale(.94);

        filter:blur(8px);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}


/* =========================================================
   LEVI MOD
   Luxury Tech Style
========================================================= */

.brand{
    position:relative;

    text-align:center;

    margin-bottom:30px;

    color:#fff;

    font-family:
        "Trebuchet MS",
        "Arial Black",
        Arial,
        sans-serif;

    font-size:22px;

    font-weight:900;

    letter-spacing:9px;

    line-height:1;

    text-transform:uppercase;

    text-shadow:
        0 0 3px #fff,
        0 0 7px #fff,
        0 0 15px rgba(255,255,255,.98),
        0 0 28px rgba(255,255,255,.78),
        0 0 48px rgba(255,255,255,.42),
        0 0 75px rgba(255,255,255,.18);

    opacity:0;

    transform:
        translateY(-20px)
        scale(.88);

    filter:blur(9px);

    animation:
        brandEnter
        1.2s
        .35s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


/* moving shine */

.brand::after{
    content:"";

    position:absolute;

    top:0;
    left:-80%;

    width:35%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.95),
            transparent
        );

    transform:skewX(-20deg);

    animation:
        brandShine
        3s
        1.6s
        ease-in-out
        infinite;

    pointer-events:none;
}


@keyframes brandEnter{

    0%{
        opacity:0;

        transform:
            translateY(-20px)
            scale(.88);

        filter:blur(9px);
    }

    55%{
        opacity:1;
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}


@keyframes brandShine{

    0%{
        left:-80%;
    }

    30%{
        left:140%;
    }

    100%{
        left:140%;
    }
}


/* =========================================================
   INPUTS
========================================================= */

.input-group{
    margin-bottom:18px;

    opacity:0;

    filter:blur(6px);
}


.login-form .input-group:nth-child(1){

    animation:
        inputEnter
        .8s
        1.05s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


.login-form .input-group:nth-child(2){

    animation:
        inputEnter
        .8s
        1.25s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


@keyframes inputEnter{

    from{
        opacity:0;

        transform:
            translateY(18px);

        filter:blur(6px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);

        filter:blur(0);
    }
}


.input{
    width:100%;

    height:57px;

    padding:
        0 18px;

    border-radius:14px;

    border:
        1px solid rgba(255,255,255,.17);

    outline:none;

    background:
        rgba(0,0,0,.15);

    color:#fff;

    font-size:15px;

    letter-spacing:.3px;

    transition:
        .3s ease;
}


.input::placeholder{
    color:
        rgba(255,255,255,.53);
}


.input:hover{

    background:
        rgba(0,0,0,.20);

    border-color:
        rgba(255,255,255,.34);
}


.input:focus{

    transform:
        translateY(-2px);

    background:
        rgba(0,0,0,.25);

    border-color:
        rgba(255,255,255,.85);

    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 0 13px rgba(255,255,255,.32),
        0 0 30px rgba(255,255,255,.09);
}


/* =========================================================
   BUTTON
========================================================= */

.button-wrap{

    margin-top:8px;

    opacity:0;

    transform:
        translateY(18px)
        scale(.96);

    filter:blur(6px);

    animation:
        buttonEnter
        .9s
        1.48s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


@keyframes buttonEnter{

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}


.login-button{

    position:relative;

    width:100%;
    height:57px;

    border:
        1px solid rgba(255,255,255,.95);

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #e6e6e6
        );

    color:#111;

    font-size:14px;

    font-weight:900;

    letter-spacing:3px;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
        0 0 9px rgba(255,255,255,.95),
        0 0 23px rgba(255,255,255,.48),
        0 0 50px rgba(255,255,255,.16);

    transition:
        .3s ease;
}


/* button shine */

.login-button::after{

    content:"";

    position:absolute;

    top:-60%;
    left:-100%;

    width:55%;
    height:220%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.98),
            transparent
        );

    transform:skewX(-20deg);

    transition:
        left .75s ease;
}


.login-button:hover::after{
    left:145%;
}


.login-button:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 0 14px #fff,
        0 0 32px rgba(255,255,255,.80),
        0 0 70px rgba(255,255,255,.38);
}


.login-button:active{
    transform:
        scale(.97);
}


/* =========================================================
   WHITE NEON BURST
========================================================= */

.burst{

    position:absolute;

    left:50%;
    top:50%;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#fff;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    pointer-events:none;

    box-shadow:
        0 0 8px #fff,
        0 0 20px #fff,
        0 0 45px #fff,
        0 0 90px #fff;
}


.login-button.animate .burst{

    animation:
        neonBurst
        .75s
        cubic-bezier(.1,.7,.2,1)
        forwards;
}


@keyframes neonBurst{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(0);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(38);
    }
}


/* =========================================================
   CREATE ACCOUNT
========================================================= */

.switch-text{

    margin-top:20px;

    text-align:center;

    color:
        rgba(255,255,255,.48);

    font-size:12px;

    opacity:0;

    animation:
        switchEnter
        .8s
        1.75s
        ease
        forwards;
}


@keyframes switchEnter{

    from{
        opacity:0;

        transform:
            translateY(10px);

        filter:blur(4px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);

        filter:blur(0);
    }
}


.switch-button{

    display:inline-block;

    margin-left:5px;

    border:none;

    background:none;

    color:#fff;

    font-size:12px;

    font-weight:700;

    cursor:pointer;

    text-shadow:
        0 0 5px #fff,
        0 0 12px rgba(255,255,255,.65);

    transition:
        .25s ease;
}


.switch-button:hover{

    text-shadow:
        0 0 6px #fff,
        0 0 18px #fff,
        0 0 35px rgba(255,255,255,.75);
}


/* =========================================================
   REGISTER
========================================================= */

.register-form{
    display:none;
}


.register-form.active{
    display:block;
}


.register-form .input-group{

    animation:
        inputEnter
        .7s
        .1s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


.register-form .button-wrap{

    opacity:1;
    transform:none;
    filter:none;
    animation:none;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    min-height:18px;

    margin-top:13px;

    text-align:center;

    font-size:11px;

    color:
        rgba(255,255,255,.88);

    opacity:0;

    transition:
        .3s ease;
}


.message.show{
    opacity:1;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:22px;

    text-align:center;

    color:
        rgba(255,255,255,.27);

    font-size:8px;

    letter-spacing:3px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

    .page{
        padding:15px;
    }

    .login-panel{
        width:100%;

        padding:
            30px
            22px
            27px;

        border-radius:22px;
    }

    .brand{
        font-size:18px;
        letter-spacing:6px;
    }

    .input,
    .login-button{
        height:55px;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     VIDEO
========================================================= -->

<video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
    preload="auto">

    <source
        src="https://files.catbox.moe/qurlw3.mp4"
        type="video/mp4">

</video>


<div class="video-dark"></div>
<div class="ambient"></div>


<!-- =========================================================
     LOGIN PAGE
========================================================= -->

<main class="page">

<section class="login-panel">


    <!-- LEVI MOD ONLY -->

    <div class="brand">
        LEVI MOD
    </div>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <div id="loginArea">

        <form
            id="loginForm"
            class="login-form">


            <div class="input-group">

                <input
                    id="loginUsername"
                    class="input"
                    type="text"
                    placeholder="Username"
                    autocomplete="username"
                    required>

            </div>


            <div class="input-group">

                <input
                    id="loginPassword"
                    class="input"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required>

            </div>


            <div class="button-wrap">

                <button
                    id="loginButton"
                    class="login-button"
                    type="submit">

                    LOGIN

                    <span class="burst"></span>

                </button>

            </div>


        </form>


        <div
            id="loginMessage"
            class="message">
        </div>


        <div class="switch-text">

            Don't have an account?

            <button
                id="showRegister"
                class="switch-button"
                type="button">

                CREATE ACCOUNT

            </button>

        </div>

    </div>


    <!-- =====================================================
         REGISTER
    ====================================================== -->

    <div
        id="registerArea"
        class="register-form">


        <form
            id="registerForm">


            <div class="input-group">

                <input
                    id="registerUsername"
                    class="input"
                    type="text"
                    placeholder="Choose Username"
                    autocomplete="username"
                    required>

            </div>


            <div class="input-group">

                <input
                    id="registerPassword"
                    class="input"
                    type="password"
                    placeholder="Choose Password"
                    autocomplete="new-password"
                    required>

            </div>


            <div class="input-group">

                <input
                    id="confirmPassword"
                    class="input"
                    type="password"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required>

            </div>


            <div
                class="button-wrap"
                style="
                    opacity:1;
                    transform:none;
                    filter:none;
                ">

                <button
                    id="registerButton"
                    class="login-button"
                    type="submit">

                    CREATE ACCOUNT

                    <span class="burst"></span>

                </button>

            </div>


        </form>


        <div
            id="registerMessage"
            class="message">
        </div>


        <div
            class="switch-text"
            style="opacity:1;">

            Already have an account?

            <button
                id="showLogin"
                class="switch-button"
                type="button">

                LOGIN

            </button>

        </div>


    </div>


    <div class="footer">
        LEVI MOD
    </div>


</section>

</main>


<script>

/* =========================================================
   VIDEO AUTOPLAY
========================================================= */

const video =
    document.getElementById("bgVideo");

window.addEventListener(
    "load",
    () => {

        video.play().catch(
            () => {}
        );

    }
);


/* =========================================================
   ELEMENTS
========================================================= */

const loginArea =
    document.getElementById("loginArea");

const registerArea =
    document.getElementById("registerArea");

const showRegister =
    document.getElementById("showRegister");

const showLogin =
    document.getElementById("showLogin");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");

const loginMessage =
    document.getElementById("loginMessage");

const registerMessage =
    document.getElementById("registerMessage");


/* =========================================================
   OPEN CREATE ACCOUNT
========================================================= */

showRegister.addEventListener(
    "click",
    () => {

        loginArea.style.opacity = "0";

        loginArea.style.transform =
            "translateX(-25px)";


        setTimeout(
            () => {

                loginArea.style.display =
                    "none";

                registerArea.classList.add(
                    "active"
                );

                registerArea.style.opacity =
                    "0";

                registerArea.style.transform =
                    "translateX(25px)";


                requestAnimationFrame(
                    () => {

                        registerArea.style.opacity =
                            "1";

                        registerArea.style.transform =
                            "translateX(0)";

                    }
                );

            },
            300
        );

    }
);


/* =========================================================
   BACK TO LOGIN
========================================================= */

showLogin.addEventListener(
    "click",
    () => {

        registerArea.style.opacity =
            "0";

        registerArea.style.transform =
            "translateX(25px)";


        setTimeout(
            () => {

                registerArea.classList.remove(
                    "active"
                );

                loginArea.style.display =
                    "block";

                loginArea.style.opacity =
                    "0";

                loginArea.style.transform =
                    "translateX(-25px)";


                requestAnimationFrame(
                    () => {

                        loginArea.style.opacity =
                            "1";

                        loginArea.style.transform =
                            "translateX(0)";

                    }
                );

            },
            300
        );

    }
);


/* =========================================================
   NEON EFFECT
========================================================= */

function neonEffect(button){

    button.classList.remove(
        "animate"
    );

    void button.offsetWidth;

    button.classList.add(
        "animate"
    );
}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    (event) => {

        event.preventDefault();

        neonEffect(
            loginButton
        );


        const username =
            document
            .getElementById(
                "loginUsername"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "loginPassword"
            )
            .value;


        const savedUser =
            localStorage.getItem(
                "levi_username"
            );


        const savedPassword =
            localStorage.getItem(
                "levi_password"
            );


        if(
            !savedUser ||
            !savedPassword
        ){

            showMessage(
                loginMessage,
                "No account found. Create an account first."
            );

            return;
        }


        if(
            username === savedUser &&
            password === savedPassword
        ){

            showMessage(
                loginMessage,
                "LOGIN SUCCESSFUL"
            );

        }else{

            showMessage(
                loginMessage,
                "Invalid username or password."
            );

        }

    }
);


/* =========================================================
   CREATE ACCOUNT
========================================================= */

registerForm.addEventListener(
    "submit",
    (event) => {

        event.preventDefault();

        neonEffect(
            registerButton
        );


        const username =
            document
            .getElementById(
                "registerUsername"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "registerPassword"
            )
            .value;


        const confirmPassword =
            document
            .getElementById(
                "confirmPassword"
            )
            .value;


        if(
            username.length < 3
        ){

            showMessage(
                registerMessage,
                "Username must contain at least 3 characters."
            );

            return;
        }


        if(
            password.length < 4
        ){

            showMessage(
                registerMessage,
                "Password must contain at least 4 characters."
            );

            return;
        }


        if(
            password !== confirmPassword
        ){

            showMessage(
                registerMessage,
                "Passwords do not match."
            );

            return;
        }


        if(
            localStorage.getItem(
                "levi_username"
            )
        ){

            showMessage(
                registerMessage,
                "An account already exists on this browser."
            );

            return;
        }


        localStorage.setItem(
            "levi_username",
            username
        );


        localStorage.setItem(
            "levi_password",
            password
        );


        showMessage(
            registerMessage,
            "ACCOUNT CREATED SUCCESSFULLY"
        );


        setTimeout(
            () => {

                showLogin.click();

            },
            1000
        );

    }
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    element,
    text
){

    element.textContent =
        text;

    element.classList.remove(
        "show"
    );

    void element.offsetWidth;

    element.classList.add(
        "show"
    );
}

</script>

</body>
</html>
