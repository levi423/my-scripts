<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVI CORE | CYBER SECURITY SYSTEM</title>
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #b026ff;
            --bg-dark: #04040c;
            --card-bg: rgba(10, 10, 26, 0.85);
            --danger: #ff0055;
            --success: #00ff66;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 20px 10px;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .cyber-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 
                        inset 0 0 15px rgba(0, 243, 255, 0.1);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .hud-corner {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--primary);
        }
        .top-left { top: -1px; left: -1px; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
        .top-right { top: -1px; right: -1px; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
        .bottom-left { bottom: -1px; left: -1px; border-right: none; border-top: none; border-bottom-left-radius: 20px; }
        .bottom-right { bottom: -1px; right: -1px; border-left: none; border-top: none; border-bottom-right-radius: 20px; }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            border-radius: 50%;
            animation: scan 2.5s infinite ease-in-out;
            opacity: 0.8;
        }

        @keyframes scan {
            0% { top: 5%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }

        .system-title {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-align: center;
        }

        .system-status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            margin-left: 5px;
            box-shadow: 0 0 8px var(--success);
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box input, .custom-select {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .input-box input:focus, .custom-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(0, 0, 0, 0.7);
        }

        .custom-select option {
            background: #0a0a1a;
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .cyber-btn {
            position: relative;
            width: 100%;
            padding: 16px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--primary);
            border-radius: 12px;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .cyber-btn:hover {
            background: var(--primary);
            color: #04040c;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
        }

        .cyber-btn.danger-btn {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(255, 0, 85, 0.05);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }

        .cyber-btn.danger-btn:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
        }

        .cyber-btn.secondary-btn {
            border-color: var(--secondary);
            color: var(--secondary);
            background: rgba(176, 38, 255, 0.05);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.1);
        }

        .cyber-btn.secondary-btn:hover {
            background: var(--secondary);
            color: #fff;
            box-shadow: 0 0 25px rgba(176, 38, 255, 0.6);
        }

        .tools-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .tool-box {
            background: rgba(10, 10, 26, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 22px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .tool-box:hover {
            border-color: var(--primary);
            background: rgba(0, 243, 255, 0.08);
            transform: translateY(-2px);
        }

        .tool-box.highlight {
            border: 1px solid var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1);
            background: linear-gradient(180deg, rgba(0, 243, 255, 0.08), rgba(10, 10, 26, 0.8));
        }

        .tool-box.danger-box {
            border: 1px solid var(--danger);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2), inset 0 0 15px rgba(255, 0, 85, 0.1);
            background: linear-gradient(180deg, rgba(255, 0, 85, 0.08), rgba(10, 10, 26, 0.8));
        }

        .tool-box.danger-box:hover {
            border-color: var(--danger);
            background: rgba(255, 0, 85, 0.15);
        }

        .tool-box.danger-box .tool-title {
            color: var(--danger);
        }

        .tool-title {
            font-size: 17px;
            font-weight: bold;
            color: #fff;
        }

        .tool-box.highlight .tool-title {
            color: var(--primary);
        }

        .terminal-log {
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            color: var(--primary);
            min-height: 18px;
            opacity: 0.9;
            text-align: center;
        }

        .logout-btn {
            border: 1px solid var(--danger);
            color: var(--danger);
            background: rgba(255, 0, 85, 0.05);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }

        .logout-btn:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
        }

        .footer-tag {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
        }

        .back-btn {
            margin-top: 15px;
            border-color: rgba(255,255,255,0.2);
            color: #ccc;
            background: transparent;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
    </style>
</head>

                <div class="tool-box highlight" onclick="openUnbanTool()">
                    <div class="tool-title">فك حظر واتساب</div>
                </div>
                <div class="tool-box danger-box" onclick="openBanTool()">
                    <div class="tool-title">بلاغ واتساب</div>
                </div>
            </div>

            <button class="cyber-btn logout-btn" style="margin-top: 15px;" onclick="logout()">
                تسجيل الخروج
            </button>
        </div>

        <div id="unbanToolView" class="hidden">
            <div style="color: var(--primary); font-weight: bold; margin-bottom: 20px; font-size: 16px;">
                قسم فك حظر واتساب الفوري
            </div>

            <div class="input-box">
                <input type="text" id="phoneInput" placeholder="أدخل رقم الهاتف بكل الصيغ" dir="ltr">
            </div>

            <div class="input-box">
                <select id="banType" class="custom-select">
                    <option value="auto">فك حظر آلي / خطأ في النظام</option>
                    <option value="spam">فك حظر الرسائل المكثفة / سبام</option>
                    <option value="third_party">فك حظر استخدام تطبيقات معدلة</option>
                    <option value="group">فك حظر سوء فهم المجموعات والبلاغات</option>
                    <option value="temp">فك حظر مؤقت / مشكلة كود التحقق</option>
                    <option value="strict">فك حظر مشدد / طعن الحظر الدائم</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="cyber-btn" onclick="processUnban(false)">
                    إرسال عبر Gmail
                </button>
                <button class="cyber-btn secondary-btn" onclick="processUnban(true)">
                    نسخ الكليشة
                </button>
            </div>

            <div class="terminal-log" id="unbanLog" style="text-align: center; font-size: 11px; white-space: pre-line;"></div>

            <button class="cyber-btn back-btn" onclick="closeUnbanTool()">
                العودة للوحة التحكم
            </button>
        </div>

        <div id="banToolView" class="hidden">
            <div style="color: var(--danger); font-weight: bold; margin-bottom: 20px; font-size: 16px;">
                ⚠ قسم بلاغ واتساب
            </div>

            <div class="input-box">
                <input type="text" id="banPhoneInput" placeholder="أدخل رقم الهاتف المزعج بكل الصيغ" dir="ltr">
            </div>

            <div class="input-box">
                <select id="reportTemplate" class="custom-select" onchange="applyReportTemplate()">
                    <option value="harassment">قالب: مضايقة متكررة</option>
                    <option value="blackmail">قالب: ابتزاز وتهديد</option>
                    <option value="impersonation">قالب: انتحال شخصية</option>
                    <option value="scam">قالب: احتيال أو محاولة خداع</option>
                    <option value="unsafe">قالب: تهديد أو خطر على السلامة</option>
                    <option value="custom">قالب: بلاغ مخصص</option>
                </select>
            </div>
<div class="input-box">
                <select id="banReason" class="custom-select">
                    <option value="harassment">مضايقات ورسائل مزعجة متكررة</option>
                    <option value="spam">رسائل احتيالية أو سبام مكثف</option>
                    <option value="impersonation">انتحال شخصية أو استخدام غير مشروع</option>
                    <option value="abuse">إساءة ومحتوى غير لائق في المجموعات</option>
                    <option value="terms">انتهاك صارخ لشروط الخدمة</option>
                </select>
            </div>
<div class="btn-group">
                <button class="cyber-btn danger-btn" onclick="processBan(false)">
                    تجهيز البلاغ
                </button>
                <button class="cyber-btn secondary-btn" onclick="processBan(true)">
                    نسخ البلاغ
                </button>
            </div>

            <div class="terminal-log" id="banLog" style="text-align: center; font-size: 11px; white-space: pre-line;"></div>

            <button class="cyber-btn back-btn" onclick="closeBanTool()">
                العودة للوحة التحكم
            </button>
        </div>
    </div>

    <script>
        // البريد الرسمي لـ الدعم الفني لواتساب
        const OFFICIAL_WHATSAPP_SUPPORT = "support@support.whatsapp.com";

        // ===== محرك معالجة وقبول كل الأرقام الذكي المطور =====
        function parseAndFormatPhone(rawInput) {
            if (!rawInput) return "";
            
            // 1. تحويل الأرقام العربية إلى أرقام إنجليزية
            let str = rawInput.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
            
            // 2. إزالة المساحات والشرطات والأقواس والرموز غير الرقمية باستثناء +
            str = str.replace(/[^\d+]/g, '');
            
            // 3. تحويل البادئة 00 إلى +
            if (str.startsWith("00")) {
                str = "+" + str.slice(2);
            }
            
            // 4. إضافة + تلقائياً في البداية إذا لم تكن موجودة
            if (!str.startsWith("+")) {
                str = "+" + str;
            }

            // 5. إزالة الصفر الزائد الملتصق بالبادئة (+010 -> +10)
            if (str.startsWith("+0") && str.length > 3) {
                str = "+" + str.slice(2);
            }
            
            return str;
        }

        // ===== نظام نسخ احتياطي يضمن العمل على جميع الأجهزة =====
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                return new Promise((resolve, reject) => {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        textArea.remove();
                        resolve();
                    } catch (err) {
                        textArea.remove();
                        reject(err);
                    }
                });
            }
        }

        // ===== تسجيل الدخول =====
        function executeAuth() {
            const btn = document.getElementById('loginBtn');
            const log = document.getElementById('termLog');
            const pass = document.getElementById('passInput').value;

            if(!pass) {
                log.style.color = 'var(--danger)';
                log.innerText = '> خطأ: يرجى كتابة الرمز أولاً!';
                return;
            }

            if(pass !== 'LEVI AMK') {
                log.style.color = 'var(--danger)';
                log.innerText = '> خطأ: كلمة السر غير صحيحة!';
                return;
            }

            btn.disabled = true;
            btn.style.opacity = '0.6';
            log.style.color = 'var(--primary)';
            
            const steps = [
                "> جاري فك تشفير البيانات...",
                "> جاري المسح البيومتري...",
                "> مطابقة البصمة الرقمية...",
                "> تم تأكيد الهوية: أهلاً بك LEVI!"
            ];

            let index = 0;
            const interval = setInterval(() => {
                log.innerText = steps[index];
                index++;
                if (index >= steps.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loginCard').classList.add('hidden');
                        document.getElementById('dashboardCard').classList.remove('hidden');
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        log.innerText = '> انتظار المدخلات...';
                    }, 600);
                }
            }, 500);
        }

        // ===== التنقل =====
        function openUnbanTool() {
            document.getElementById('mainToolsView').classList.add('hidden');
            document.getElementById('unbanToolView').classList.remove('hidden');
            document.getElementById('banToolView').classList.add('hidden');
            document.getElementById('unbanLog').innerText = '';
        }

        function closeUnbanTool() {
            document.getElementById('unbanToolView').classList.add('hidden');
            document.getElementById('mainToolsView').classList.remove('hidden');
        }

        function openBanTool() {
            document.getElementById('mainToolsView').classList.add('hidden');
            document.getElementById('banToolView').classList.remove('hidden');
            document.getElementById('unbanToolView').classList.add('hidden');
            document.getElementById('banLog').innerText = '';
            const templateSelect = document.getElementById('reportTemplate');
            if (templateSelect) templateSelect.value = 'harassment';
        }

        function closeBanTool() {
            document.getElementById('banToolView').classList.add('hidden');
            document.getElementById('mainToolsView').classList.remove('hidden');
        }

        // ===== فك الحظر =====
        function processUnban(onlyCopy = false) {
            const rawPhone = document.getElementById('phoneInput').value.trim();
            const banType = document.getElementById('banType').value;
            const log = document.getElementById('unbanLog');

            const phone = parseAndFormatPhone(rawPhone);

            if(!phone || phone.length < 6) {
                log.style.color = 'var(--danger)';
                log.innerText = '> خطأ: يرجى إدخال رقم هاتف صحيح!';
                return;
            }

            log.style.color = 'var(--primary)';
            log.innerText = '> جاري معالجة وتنسيق الرقم للسيستم...';

            let subject = "";
            let body = "";

            if (banType === 'auto') {
                subject = `Appeal for Unjustified Automated Account Suspension - ${phone}`;
                body = `Dear WhatsApp Support Team,\n\nI am writing to formally request the reinstatement of my WhatsApp account registered under ${phone}.\n\nMy account was unexpectedly suspended, likely due to an automated system error or false flag. I strictly follow the WhatsApp Terms of Service and use this number exclusively for personal, family, and professional communication.\n\nI kindly ask for a manual review of my account logs to verify that no violations occurred and restore my service as soon as possible.\n\nThank you for your prompt assistance.\n\nSincerely,\nPhone Number: ${phone}`;
            } else if (banType === 'spam') {
                subject = `Request for Account Re-evaluation - Spam Flag Appeal ${phone}`;
                body = `Dear WhatsApp Support Team,\n\nI am writing to appeal the restriction placed on my account (${phone}) due to alleged spam activity.\n\nI assure you that I do not engage in mass marketing, automated messaging, or sending unsolicited messages. Any increase in message volume was solely due to normal personal conversations and active participation in legitimate family/community groups.\n\nI request a manual human review to re-examine my account activity and lift the restriction.\n\nThank you for your time and understanding.\n\nBest regards,\nPhone Number: ${phone}`;
            } else if (banType === 'third_party') {
                subject = `Reinstatement Request - Official WhatsApp Client Restored ${phone}`;
                body = `Dear WhatsApp Support Team,\n\nI am writing to request the unbanning of my account (${phone}), which was suspended for using an unauthorized third-party application.\n\nI fully acknowledge this mistake and have completely uninstalled all modified third-party clients. I have now installed the official WhatsApp application directly from the official store.\n\nI guarantee complete adherence to WhatsApp's Terms of Service going forward and respectfully ask for one opportunity to access my account via the official app.\n\nSincerely,\nPhone Number: ${phone}`;
            } else if (banType === 'group') {
                subject = `Account Suspension Appeal - Group Activity Issue ${phone}`;
                body = `Dear WhatsApp Support Team,\n\nI request a review regarding the suspension of my account (${phone}) following group chat activity or user reports.\n\nI believe my account was mistakenly flagged or unfairly reported during group discussions. I have never intended to share harmful, inappropriate, or policy-violating content.\n\nI kindly request a manual review of my case to resolve this misunderstanding and reactivate my account.\n\nBest regards,\nPhone Number: ${phone}`;
            } else if (banType === 'temp') {
                subject = `Temporary Ban & Verification Issue Appeal - ${phone}`;
                body = `Dear WhatsApp Support Team,\n\nI am contacting you regarding a temporary suspension and activation difficulty on my account (${phone}).\n\nI encountered a sudden temporary ban while attempting standard account verification or routine usage. I have not violated any communication guidelines.\n\nPlease inspect my device logs and release the temporary hold on my phone number.\n\nThank you for your support.\n\nRegards,\nPhone Number: ${phone}`;
            } else if (banType === 'strict') {
                subject = `URGENT: Final Appeal for Permanent Account Suspension ${phone}`;
                body = `Dear WhatsApp Support Team,\n\nI am submitting a final urgent request for a human supervisor to review the permanent suspension of my account (${phone}).\n\nWhatsApp is my vital channel for critical personal and daily communication. I sincerely state that I have never intentionally breached WhatsApp Terms of Service, engaged in spam, or used prohibited automation tools.\n\nIf any system anomaly occurred, I sincerely apologize and assure full compliance with all policies. I humbly request a comprehensive manual review to reinstate my account.\n\nThank you for your compassion and time.\n\nRespectfully,\nPhone Number: ${phone}`;
            }

            const unbanSteps = [
                `> الرقم بعد التنسيق الذكي: ${phone}`,
                `> اختيار بروتوكول الطعن للنوع: ${banType}`,
                `> توجيه الطلب إلى: ${OFFICIAL_WHATSAPP_SUPPORT}`,
                onlyCopy ? `> جاري نسخ البلاغ إلى الحافظة...` : `> فتح تطبيق Gmail المباشر...`
            ];

            let i = 0;
            const timer = setInterval(() => {
                log.innerText += '\n' + unbanSteps[i];
                i++;
                if(i >= unbanSteps.length) {
                    clearInterval(timer);
                    setTimeout(() => {
                        if(onlyCopy) {
                            const fullContent = `الموضوع: ${subject}\n\n${body}`;
                            copyToClipboard(fullContent).then(() => {
                                log.innerText += '\n✅ تم نسخ كليشة الطعن بنجاح!';
                            }).catch(() => {
                                log.innerText += '\n⚠ تعذر النسخ التلقائي، حاول مرة أخرى.';
                            });
                        } else {
                            // فتح تطبيق البريد المباشر لحل مشكلة ERR_TOO_MANY_REDIRECTS
                            const mailtoUrl = `mailto:${OFFICIAL_WHATSAPP_SUPPORT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                            window.location.href = mailtoUrl;
                        }
                    }, 600);
                }
            }, 500);
        }

        // ===== تقديم البلاغ الرسمي =====
        // قوالب بلاغات مهنية: استخدم القالب المناسب فقط إذا كان يصف الواقعة فعلًا.
        const REPORT_TEMPLATES = {
            harassment:
                "هذا الحساب يرسل لي رسائل غير مرغوب فيها بشكل متكرر رغم عدم رغبتي في التواصل. أطلب مراجعة النشاط واتخاذ الإجراء المناسب وفق سياسات واتساب.",

            blackmail:
                "أبلغ عن واقعة ابتزاز وتهديد مرتبطة بهذا الحساب. توجد محادثات/مواد مرتبطة بالواقعة يمكنني تقديمها عند طلبها. أطلب مراجعة الحساب واتخاذ إجراءات السلامة المناسبة وفق سياسات واتساب.",

            impersonation:
                "أشتبه في أن هذا الحساب يستخدم هوية أو اسمًا بطريقة توحي بانتحال شخصية شخص آخر. أطلب مراجعة الحساب والمعلومات المتاحة واتخاذ الإجراء المناسب إذا ثبتت المخالفة.",

            scam:
                "أبلغ عن نشاط أشتبه في أنه محاولة احتيال أو خداع للمستخدمين. أطلب مراجعة الرسائل والنشاط المرتبط بالحساب واتخاذ الإجراء المناسب إذا ثبتت المخالفة.",

            unsafe:
                "أبلغ عن رسائل أو سلوك أعتبره تهديدًا لسلامتي أو سلامة مستخدمين آخرين. أطلب مراجعة عاجلة للحساب واتخاذ الإجراءات المناسبة وفق سياسات السلامة.",

            custom: ""
        };

        function applyReportTemplate() {
            const type = document.getElementById('reportTemplate').value;
            const details = document.getElementById('incidentDetails');
            if (!details) return;

            if (type === 'custom') {
                details.value = '';
                details.focus();
                return;
            }

            details.value = REPORT_TEMPLATES[type] || '';
        }

        function processBan(onlyCopy = false) {
            const rawPhone = document.getElementById('banPhoneInput').value.trim();
            const reason = document.getElementById('banReason').value;
            const log = document.getElementById('banLog');

            const phone = parseAndFormatPhone(rawPhone);

            if (!phone || phone.length < 6) {
                log.style.color = 'var(--danger)';
                log.innerText = '> خطأ: يرجى إدخال رقم هاتف صحيح!';
                return;
            }
// منع التكرار السريع لنفس الرقم من نفس الصفحة.
            const reportKey = `levi_report_${phone}`;
            const lastReport = Number(localStorage.getItem(reportKey) || 0);
            const now = Date.now();
            const cooldown = 10 * 60 * 1000;

            if (now - lastReport < cooldown) {
                const remaining = Math.ceil((cooldown - (now - lastReport)) / 60000);
                log.style.color = 'var(--danger)';
                log.innerText = `> تم تجهيز بلاغ لهذا الرقم مؤخرًا. انتظر حوالي ${remaining} دقيقة قبل إنشاء بلاغ آخر.`;
                return;
            }

            log.style.color = 'var(--danger)';
            log.innerText = '> جاري تجهيز بلاغ واحد منظم بناءً على البيانات المدخلة...';

            const templateType = document.getElementById('reportTemplate').value;
            const details = REPORT_TEMPLATES[templateType] || REPORT_TEMPLATES.harassment;

            const subject = `WhatsApp Safety Report - ${phone}`;
            const body =
`Dear WhatsApp Safety and Support Team,

I am submitting a safety report concerning the WhatsApp account below.

Target Phone Number: ${phone}
Category: ${reason.toUpperCase()}

Incident description:
${details}

Please review the relevant account activity and determine whether the account violates WhatsApp policies.

If additional information or evidence is required, please let me know through the appropriate official support process.

I understand that the final decision to restrict, suspend, or take any other action against an account is made by WhatsApp after its own review.

Thank you for reviewing this report.

Sincerely,
User Safety Report`;

            const steps = [
                `> الرقم المنسق: ${phone}`,
                `> تصنيف الواقعة: ${reason}`,
                `> التحقق من وجود وصف للواقعة: تم`,
                `> تجهيز بلاغ واحد منظم: تم`,
                onlyCopy ? `> جاري نسخ البلاغ للحافظة...` : `> فتح تطبيق البريد لإرسال البلاغ...`
            ];

            let i = 0;
            const timer = setInterval(() => {
                log.innerText += '\n' + steps[i];
                i++;

                if (i >= steps.length) {
                    clearInterval(timer);

                    setTimeout(() => {
                        localStorage.setItem(reportKey, String(Date.now()));

                        if (onlyCopy) {
                            copyToClipboard(`الموضوع: ${subject}\n\n${body}`).then(() => {
                                log.innerText += '\n✅ تم نسخ البلاغ المنظم بنجاح.';
                            }).catch(() => {
                                log.innerText += '\n⚠ تعذر النسخ التلقائي، حاول مرة أخرى.';
                            });
                        } else {
                            const mailtoUrl =
                                `mailto:${OFFICIAL_WHATSAPP_SUPPORT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                            window.location.href = mailtoUrl;
                            log.innerText += '\n✅ تم فتح تطبيق البريد لإرسال البلاغ.';
                        }
                    }, 600);
                }
            }, 450);
        }

        // ===== تسجيل الخروج =====
        function logout() {
            document.getElementById('dashboardCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('passInput').value = '';
            closeUnbanTool();
            closeBanTool();
        }

        // ===== خلفية الجزيئات =====
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 243, 255, 0.5)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 65; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 110) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(176, 38, 255, ${1 - dist / 110})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
