<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة تحكم احترافية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --sidebar-width: 250px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: block;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* شبكة البطاقات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-main);
        }

        /* القسم التفاعلي */
        .interactive-section {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* تجاوب الشاشة */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-left: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <div class="brand">⚡ LEVI DASH</div>
        <ul class="nav-links">
            <li><a href="#" class="active">الرئيسية</a></li>
            <li><a href="#">التحليلات</a></li>
            <li><a href="#">المشاريع</a></li>
            <li><a href="#">الإعدادات</a></li>
        </ul>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <header>
            <h1>لوحة التحكم العامة</h1>
            <div class="user-profile">
                <div class="avatar">L</div>
                <span>مرحباً، LEVI</span>
            </div>
        </header>

        <!-- الإحصائيات -->
        <section class="stats-grid">
            <div class="card">
                <div class="card-title">إجمالي المبيعات</div>
                <div class="card-value">$24,500</div>
            </div>
            <div class="card">
                <div class="card-title">المستخدمين النشطين</div>
                <div class="card-value">1,230</div>
            </div>
            <div class="card">
                <div class="card-title">معدل التحويل</div>
                <div class="card-value">14.2%</div>
            </div>
            <div class="card">
                <div class="card-title">الطلبات الجديدة</div>
                <div class="card-value">89</div>
            </div>
        </section>

        <!-- قسم تفاعلي -->
        <section class="interactive-section">
            <h2 style="margin-bottom: 15px;">منطقة التجربة التفاعلية</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">
                يمكنك تخصيص هذه الواجهة وسحب مكوناتها للتطبيق في مشاريعك الخاصة.
            </p>
            <button class="btn" onclick="showAlert()">تفاعل الآن</button>
        </section>
    </main>

    <script>
        function showAlert() {
            alert("تم ضغط الزر بنجاح! الواجهة تعمل بشكل ممتاز.");
        }
    </script>
</body>
</html>
